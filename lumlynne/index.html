<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumlynne</title><style>body{background:#101426;color:#fff;font:16px system-ui;margin:6vh auto;max-width:600px;padding:20px}h1{font-size:3em}button,select,input{padding:12px;border:0;border-radius:9px;margin:4px}button{background:#b5a2fa;cursor:pointer}#chat{height:320px;overflow:auto;background:#202840;border-radius:14px;padding:16px;overflow-wrap:anywhere}input{width:60%}</style><h1>Lumlynne</h1><p>DON'T SWIPE. TALK.</p><small>Protótipo para maiores de 18 anos. Não compartilhe informações pessoais.</small><p><select id="lang"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option></select><button id="start">Conectar</button><button id="next">Próximo</button><button id="report">Denunciar</button></p><p id="status">Desconectado</p><div id="chat" role="log"></div><form id="form"><input id="msg" maxlength="1000" placeholder="Mensagem"><button>Enviar</button></form><script>
let ws;const chat=document.querySelector('#chat'),status=document.querySelector('#status');function line(t){const p=document.createElement('p');p.textContent=t;chat.append(p);chat.scrollTop=chat.scrollHeight}function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}
document.querySelector('#start').onclick=()=>{ws?.close();chat.replaceChildren();ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);status.textContent='Conectando';ws.onopen=()=>send({type:'join',lang:document.querySelector('#lang').value});ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='waiting')status.textContent='Procurando pessoa...';if(m.type==='matched')status.textContent='Conectado!';if(m.type==='left')status.textContent='A outra pessoa saiu';if(m.type==='reported')status.textContent='Denúncia registrada nesta sessão';if(m.type==='message')line('Pessoa: '+m.text)};ws.onclose=()=>status.textContent='Desconectado'};
document.querySelector('#next').onclick=()=>{chat.replaceChildren();send({type:'next'})};document.querySelector('#report').onclick=()=>send({type:'report'});document.querySelector('#form').onsubmit=e=>{e.preventDefault();const i=document.querySelector('#msg');if(!i.value.trim())return;send({type:'message',text:i.value});line('Você: '+i.value);i.value=''};</script></html>
